# Every push to "main" builds StockSense on a real Windows machine, tests it,
# and publishes the installer + portable zip on this repo's Releases page
# (the repo is public, so the program can check there for updates).
name: Build StockSense for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10" pytest

      - name: Run tests
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest -q tests

      - name: Build StockSense.exe
        run: pyinstaller stocksense.spec --noconfirm

      - name: Self-test the finished program
        run: |
          $p = Start-Process -FilePath "dist\StockSense\StockSense.exe" -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "selftest timed out" }
          Get-Content "$env:TEMP\stocksense-selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Read version
        id: ver
        run: |
          $v = python -c "import stocksense; print(stocksense.VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Make portable zip
        run: Compress-Archive -Path dist\StockSense -DestinationPath "StockSense-${{ steps.ver.outputs.version }}-portable.zip"

      - name: Build installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\stocksense.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: StockSense-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/*.exe
            *.zip

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = @((Get-ChildItem installer\Output\*.exe).FullName) + @((Get-ChildItem *.zip).FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "StockSense $tag" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "release upload failed" }
